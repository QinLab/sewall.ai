name: pages

# Publishes the landing page (site/), the figures (docs/figures/) and the verified
# gallery (gallery/, under /gallery/). Every manifest is verified offline and scanned
# before publication; the build makes no model or source request.
on:
  push:
    branches: [main]
    paths: ["gallery/**", "sewall/**", "site/**", "docs/figures/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build verified gallery
        run: python -m sewall gallery --catalog gallery/catalog.json --out _site/gallery
      - name: Add landing page and figures
        run: |
          cp -R site/. _site/
          mkdir _site/figures
          cp docs/figures/fig*.png _site/figures/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
